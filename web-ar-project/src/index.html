<!-- npm run dev -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Web AR with Hand Tracking</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- QR Scanner Lib -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div id="qr-scanner">
    <div id="qr-reader"></div>
    <p>Scanne einen QR-Code, um zu starten</p>
    <button id="start-scan">Scanner starten</button>
    <button id="skip-qr">Überspringen</button>
  </div>

  <a-scene
    id="ar-scene"
    embedded
    vr-mode-ui="enabled:false"
    style="opacity:0; transition:opacity .35s"
    arjs="sourceType: webcam;
          trackingMethod: best;
          detectionMode: mono;
          debugUIEnabled: false;
          smoothCount:10; smoothTolerance:0.01; smoothThreshold:5;">

    <a-marker
      id="hiroMarker"
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">
      <!-- Standardmodell (wird ersetzt nach QR) -->
      <!--<a-box class="interactable model-root"
             position="0 0.5 0"
             rotation="0 45 0"
             color="#4CC3D9"
             scale="0.5 0.5 0.5"></a-box>-->

      <!-- Loading Label (wird ersetzt nach QR/Modell-Load) -->
    <a-entity class="loading-label"
                position="0 0.3 0"
                text="value: Loading...; color: #fff; align: center; width: 2; font: roboto"
                look-at="[camera]"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <div id="marker-status" style="position:fixed;top:10px;left:10px;
       background:rgba(0,0,0,.8);color:#fff;padding:8px 12px;
       font:11px monospace;z-index:9998;display:none;">
    <div id="marker-state">Marker: …</div>
  </div>

  <canvas id="hand-overlay"></canvas>
  <div id="gesture-status">L: - | R: -</div>
  <div class="grab-hint" id="grab-hint">Pinch (Daumen + Zeigefinger) zum Greifen</div>

  <script type="module" src="./app.js"></script>
</body>
</html>
