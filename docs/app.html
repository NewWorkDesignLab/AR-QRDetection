<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Web AR mit Hand Tracking</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <script>
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  </script>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- QR Scanner Lib -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/jsqr/dist/jsQR.js"></script>
  <script type="module" src="./app.js"></script>
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/ui.css">
</head>
<body class="ar-view">
  <div id="qr-scanner">
    <div class="qr-frame">
      <div id="qr-reader"></div>
    </div>
    <p id="qr-hint">Halte den Code in den Rahmen</p>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p class="loading-text">Lade Modell…</p>
  </div>

  <!-- Marker-Hinweis -->
  <div id="marker-hint" class="marker-hint">Marker nicht erkannt. Bitte näher herantreten.</div>

  <div id="permission-modal" class="modal hidden">
    <div class="modal-card">
      <h3>Kamera-Zugriff benötigt</h3>
      <p>Wir brauchen die Kamera, um den QR-Code zu scannen.</p>
      <div class="cta-row">
        <button id="permit-continue" class="primary">Weiter</button>
        <button id="permit-cancel" class="ghost">Abbrechen</button>
      </div>
    </div>
  </div>

  <a-scene
    id="ar-scene"
    embedded
    vr-mode-ui="enabled:false"
    style="opacity:0; transition:opacity .35s"
    renderer="antialias: true; alpha: true; precision: medium; logarithmicDepthBuffer: true; colorManagement: true;"
    arjs="sourceType: webcam;
          trackingMethod: best;
          detectionMode: mono;
          debugUIEnabled: false;
          smoothCount:10; smoothTolerance:0.01; smoothThreshold:5;">

    <a-marker
      id="hiroMarker"
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">
      
      <!-- Loading Label mit Hintergrund/ Funktioniert gerade nicht-->
      <a-entity class="loading-label" position="0 0.5 0" rotation="-90 0 0">
        <!-- Hintergrund-Plane -->
        <!--<a-plane
          color="#000"
          opacity="0.5"
          width="4.5"
          height="1"
          position="0 0 0">
        </a-plane>-->
        <!-- Text -->
        <a-text
          value="Loading..."
          color="#000"
          align="center"
          width="4"
          position="0 0 0.5">
        </a-text>
      </a-entity>
      
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <div id="marker-status" style="position:fixed;top:10px;left:10px;
       background:rgba(0,0,0,.8);color:#fff;padding:8px 12px;
       font:11px monospace;z-index:9998;display:none;">
    <div id="marker-state">Marker: …</div>
  </div>

  <canvas id="hand-overlay"></canvas>

  <!-- AR Scene Navigation Bar -->
  <div id="ar-nav-bar" class="ar-nav-bar hidden">
    <button id="next-scan-btn" class="ar-nav-btn primary">
      Nächsten QR scannen
    </button>
    <button id="back-home-btn" class="ar-nav-btn">
      Startseite
    </button>
  </div>

  <!-- Info Panel (wird bei Poke geöffnet) -->
  <div id="info-panel" class="info-panel hidden">
    <h2 id="info-title">Modell-Info</h2>
    <p id="info-description">Beschreibung wird geladen...</p>
    <button id="info-cta-btn" class="info-cta-btn primary hidden">
      Mehr erfahren
    </button>
    <div id="info-meta" class="info-meta"></div>
  </div>
</body>
</html>
